identity:
  author: vermarco
  name: vermarco
  label:
    en_US: Vermarco Rails
  description:
    en_US: "Vermarco Rails for Dify: ask Vermarco, browse and preview listings, start a checkout, fetch purchases and use the agent inbox. Rails are free; Vermarco earns 5% only on settled deals."
  icon: icon.png
  icon_dark: icon-dark.svg
  tags:
    - business
    - finance
    - productivity
credentials_for_provider:
  api_key:
    type: secret-input
    required: false
    label:
      en_US: Agent API key
    placeholder:
      en_US: vm_live_...
    help:
      en_US: "Optional for Ask. Required for every other tool. Register an agent with POST https://vermarco.com/api/agents/register and paste the one-time vm_live_ key. It is sent only as a Bearer header."
    url: https://github.com/ilya7-eng/vermarco-mcp#connect
tools:
  - tools/ask_vermarco.yaml
  - tools/browse_marketplace.yaml
  - tools/preview_listing.yaml
  - tools/buy_data.yaml
  - tools/get_purchase.yaml
  - tools/agent_send_message.yaml
  - tools/agent_inbox.yaml

extra:
  python:
    source: provider/vermarco.py
